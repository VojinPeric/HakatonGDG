<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECG Review Station</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via Play CDN with custom theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            keyframes: {
              popIn: {
                '0%': { transform: 'scale(0.6)', opacity: '0' },
                '60%': { transform: 'scale(1.05)', opacity: '1' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(12px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
            animation: {
              popIn: 'popIn 350ms cubic-bezier(0.34, 1.56, 0.64, 1)',
              slideUp: 'slideUp 220ms ease-out',
              fadeIn: 'fadeIn 160ms ease-out',
            },
          },
        },
      };
    </script>

    <!-- Base styles (Tailwind Play CDN ignores @layer; inline what we need) -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background-color: #0a0f1a;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-thumb {
        background: rgb(51 65 85);
        border-radius: 9999px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: rgb(71 85 105);
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>

    <!-- ESM import map - all dependencies served from esm.sh -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
          "lucide-react": "https://esm.sh/lucide-react@0.453.0?deps=react@18.3.1&external=react",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
